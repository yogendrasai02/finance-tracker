name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: financetracker
          POSTGRES_USER: financetracker
          POSTGRES_PASSWORD: financetracker_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financetracker -d financetracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Local Docker creates these via docker-entrypoint-initdb.d on first start (db/init);
      # the CI service container has no such hook, so the same script runs explicitly here.
      # Superseded by Testcontainers in step 3.
      - name: Bootstrap database roles
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: financetracker_dev
          POSTGRES_USER: financetracker
          POSTGRES_DB: financetracker
          FT_MIGRATOR_PASSWORD: ft_migrator_dev
          FT_APP_PASSWORD: ft_app_dev
        run: ../db/init/01-roles-and-schema.sh
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

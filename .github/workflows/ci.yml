name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Every action is pinned to a full commit SHA, not a tag, because a tag can be moved to different code after it is published.
# The comment after each SHA names the release it came from; Dependabot reads it when it proposes an update.

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  statement-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SR-47: no spreadsheet, CSV, PDF, or statements/ path may be tracked.
      - run: scripts/check-no-statement-files.sh

  dependency-scan:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.6.0
      # sha256 of osv-scanner_linux_amd64, from that release's osv-scanner_SHA256SUMS file.
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install OSV-Scanner
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
      - name: Scan dependencies
        run: |
          set +e
          ./osv-scanner scan source --format json --all-packages --output-file osv-results.json \
            -L backend/pom.xml -L frontend/package-lock.json
          status=$?
          set -e
          # 0 is no findings and 1 is some findings; the next step decides which findings fail the build.
          # Any other code is a scanner error, which must fail rather than look like a clean scan.
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi
      # SR-19: fails at CVSS 9.0 or higher.
      - run: scripts/check-critical-cves.sh osv-results.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

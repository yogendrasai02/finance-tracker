spring:
  application:
    name: backend
  profiles:
    active: local
  datasource:
    hikari:
      data-source-properties:
        # pgjdbc defaults this to true, which puts the server's DETAIL into every exception message.
        # A unique violation's DETAIL prints the conflicting values, such as a narration or an amount (SECURITY.md SR-28).
        # Set here, in the base file, so every profile is safe unless a developer turns it on locally and knowingly (D-30).
        # ProductionEnvironmentGuard refuses to start prod unless it is false.
        logServerErrorDetail: false
  jpa:
    # Off, so a request's EntityManager and its database connection end with the service call, not when the response is written.
    # With it on, an upload would keep the connection it used to read the account while it waits for the parser.
    open-in-view: false
  session:
    # Idle timeout (D-34, D-38).
    # The absolute lifetime below is a second, independent limit that this alone cannot give (SR-38).
    timeout: 30m
    jdbc:
      # V6 migration sql file is the only thing that creates auth.spring_session; Spring Session must never create its own copy of it.
      initialize-schema: never
      # Schema-qualified so the session rows land in auth, not app (D-34).
      # Spring Session builds its attributes-table name by appending _ATTRIBUTES to this value, so the result is auth.spring_session_attributes.
      table-name: auth.spring_session

server:
  servlet:
    session:
      cookie:
        # A name of our own, because JSESSIONID announces the stack to anyone reading the response.
        name: FT_SESSION
        # Security property attrs: SECURITY.md SR-37.
        # http-only keeps JavaScript, and therefore any XSS bug, away from the session id.
        # secure keeps it off plain HTTP; browsers treat http://localhost as a secure context, so local development still works.
        # same-site strict means the browser never attaches it to a request another site started, which is the first of the two CSRF defences.
        http-only: true
        secure: true
        same-site: strict

logging:
  level:
    # Pinned so a broader DEBUG setting, such as on org.springframework.security, cannot reach these two loggers (SECURITY.md SR-25).
    # AbstractUserDetailsAuthenticationProvider logs the submitted email at DEBUG for an unknown account.
    org.springframework.security.authentication: INFO
    # At TRACE this logs every bound parameter value, which for the importer means narrations and amounts.
    org.hibernate.orm.jdbc.bind: INFO

ft:
  session:
    # SR-38's second, independent limit: a session is destroyed this long after it was created, even while it stays active.
    # Enforced by AbsoluteSessionTimeoutFilter, because Spring Session's own timeout is idle-only.
    absolute-timeout: 12h
  login-rate-limit:
    # SR-39, D-40: keyed by client IP and email together, enforced by LoginRateLimitFilter before the password check runs.
    per-minute: 5
    per-hour: 20
